name: Synthetic journeys

# Book, find and cancel a flight, and check the status boards, against the
# live sites every 30 minutes. A failure here is the first sign a passenger
# would hit the same problem. Telemetry from these runs is tagged
# user_agent.synthetic.type = "test" (see shared/rum.ts).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: journeys
  cancel-in-progress: false

jobs:
  journeys:
    name: Passenger journeys
    if: >-
      vars.BOOKING_SITE != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOOKING_URL: https://${{ vars.BOOKING_SITE }}.web.app
      STATUS_URL: https://${{ vars.STATUS_SITE }}.web.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run journeys
        run: npx playwright test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
