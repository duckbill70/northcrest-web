name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    # The deploy account trusts only jobs in this environment, and the
    # environment admits only main (see README).
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      BOOKING_SITE: ${{ vars.BOOKING_SITE }}
      STATUS_SITE: ${{ vars.STATUS_SITE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        env:
          VITE_OTEL_EDGE_URL: ${{ vars.OTEL_EDGE_URL }}
          VITE_OTEL_SAMPLE_RATIO: ${{ vars.OTEL_SAMPLE_RATIO || '1' }}
          VITE_RELEASE: ${{ github.sha }}
          VITE_BOOKING_URL: https://${{ vars.BOOKING_SITE }}.web.app
          VITE_STATUS_URL: https://${{ vars.STATUS_SITE }}.web.app
        run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Map hosting targets to sites
        run: |
          cat > .firebaserc <<JSON
          {
            "projects": { "default": "$GCP_PROJECT" },
            "targets": { "$GCP_PROJECT": { "hosting": { "booking": ["$BOOKING_SITE"], "status": ["$STATUS_SITE"] } } }
          }
          JSON

      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting --project "$GCP_PROJECT" --non-interactive --message "${GITHUB_SHA::7}"

      - name: Smoke test
        run: |
          curl -fsS "https://$BOOKING_SITE.web.app/" -o /dev/null
          curl -fsS "https://$STATUS_SITE.web.app/" -o /dev/null
          curl -fsS "https://$BOOKING_SITE.web.app/api/airports" | head -c 200; echo
          curl -fsS "https://$STATUS_SITE.web.app/api/status/airports" | head -c 200; echo
